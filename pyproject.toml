[project]
name = "computer-vision"
version = "0.1.0"
description = "Hand and Gesture tracking for robot arm control"
authors = [
    {name = "SMcQ618",email = "stephensodipo13@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "mediapipe (>=0.10.33,<0.11.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "pyfirmata (>=1.1.0,<2.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "cvzone (>=1.6.1,<2.0.0)",
    "adafruit-circuitpython-bno055 (>=5.4.21,<6.0.0)"
]

[project.optional-dependencies]
hardware = []
# pyrealsense2 is excluded from PyPI install cause its arm64.
# No prebuilt wheels are there for the arm64, so just use the realsense camera support and install the native
# library via homebreaw: brew install librealsense

[tool.poetry]
package-mode = false

[tool.poetry.group.hardware]
optional = true

[tool.poetry.group.hardware.dependencies]
# pyrealsense2 must be installed manually


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
